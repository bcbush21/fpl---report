name: FPL report

on:
  schedule:
    - cron: "17 11 * * *"   # every day around 7:17am Eastern
  workflow_dispatch:         # lets you hit "Run workflow" by hand
  issues:                    # rebuild when you add, edit or close a watch-list pick
    types: [opened, edited, closed, reopened]
  push:
    branches: [main]

permissions:
  contents: write   # saves the predictions log back to the repo
  issues: read      # the watch list lives in issues
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fpl_report.py
        env:
          REPORT_PATH: site/index.html
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save predictions log
        run: |
          git config user.name "fpl-report-bot"
          git config user.email "fpl-report-bot@users.noreply.github.com"
          git add predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update predictions log"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
