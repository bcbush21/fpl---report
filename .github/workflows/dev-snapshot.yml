name: Dev snapshot

# Development only: on pushes to the dev branch, build the report and save a copy of the
# raw FPL data, so changes can be tested against real numbers without touching the live site.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: mkdir -p dev && (python fpl_report.py 2>&1 | tee dev/log.txt) || true
        env:
          REPORT_PATH: dev/index.html
          SNAPSHOT_OUT: dev/snapshot.pkl.gz
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Save snapshot
        run: |
          git config user.name "fpl-report-bot"
          git config user.email "fpl-report-bot@users.noreply.github.com"
          git add -f dev/
          if [ -f other_comps.json ]; then git add other_comps.json; fi
          git commit -m "Dev snapshot [skip ci]" && git push origin HEAD:dev
